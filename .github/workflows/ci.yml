name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check core package stdlib-only
        run: sh scripts/check-core-stdlib.sh
      - name: Run tests
        run: go test -race -v ./...
      - name: Run nested module tests
        run: |
          for module in adapters/openai adapters/ollama examples/rag_app examples/route_planner; do
            (cd "$module" && go test -race -v ./...)
          done
          (cd examples/openai_judge && go test -race -tags=example -v ./...)

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m
